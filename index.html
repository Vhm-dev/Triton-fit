<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10121a"><title>Biblioteca de Exercícios</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#f5f5f8;background:#10121a}*{box-sizing:border-box}body{margin:0}header{padding:28px max(20px,calc((100vw - 1100px)/2));background:#171a25;border-bottom:1px solid #2d3040}.eyebrow{color:#b6a1ff;text-transform:uppercase;font-size:12px;letter-spacing:.14em;font-weight:800}h1{font-size:clamp(28px,5vw,46px);margin:8px 0}p{color:#b9bdc9;line-height:1.55}main{max-width:1100px;margin:auto;padding:24px 20px 70px}.controls{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0 26px}input,select{background:#202431;color:white;border:1px solid #3c4051;border-radius:12px;padding:14px;font-size:15px;min-width:0}input{flex:2 1 280px}select{flex:1 1 170px}.count{font-size:13px;color:#aeb4c4;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:16px}.card{background:#1b1e29;border:1px solid #323645;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}.tag{font-size:12px;color:#b5a5ff}.card h2{font-size:19px;margin:0}.card p{font-size:13px;margin:0;flex:1}.btn{border:0;border-radius:10px;background:#a78bfa;color:#11121a;font-weight:800;padding:11px 13px;cursor:pointer;text-align:center;text-decoration:none}.btn:hover{background:#c0aaff}.detail{max-width:780px;margin:auto}.back{display:inline-block;color:#c2b1ff;text-decoration:none;margin-bottom:22px}.visual{height:240px;border:1px dashed #4d5265;background:#222633;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#aeb5c8;text-align:center;padding:20px}.visual img{max-height:100%;max-width:100%;object-fit:contain}.steps li{margin:12px 0;line-height:1.5}.note{padding:14px;border-left:3px solid #a78bfa;background:#242635;border-radius:8px;margin-top:20px}footer{color:#858b9d;text-align:center;font-size:12px;padding:24px}.hidden{display:none}a{color:#c9baff}
</style></head><body><header><div class="eyebrow">Treinamento • Técnica • Evolução</div><h1>Biblioteca de Exercícios</h1><p>Encontre movimentos, consulte orientações e compartilhe links diretos com seus alunos.</p></header><main><section id="catalog"><div class="controls"><input id="search" placeholder="Pesquisar exercício, músculo ou equipamento" aria-label="Pesquisar exercícios"><select id="group" aria-label="Filtrar por grupo muscular"><option value="">Todos os grupos</option></select></div><div id="count" class="count"></div><div id="grid" class="grid"></div></section><section id="detail" class="detail hidden"></section></main><footer>Material educativo. Ajuste a execução à avaliação individual e à orientação profissional.</footer><script src="exercises.js"></script><script>
const data=window.EXERCISES||[];const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const groups=[...new Set(data.map(x=>x.group))].sort();$('group').innerHTML+=[...groups].map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
function catalog(){const q=$('search').value.toLocaleLowerCase('pt-BR').trim(),g=$('group').value;const list=data.filter(x=>(!g||x.group===g)&&[x.name,x.group,x.equipment].join(' ').toLocaleLowerCase('pt-BR').includes(q));$('count').textContent=`${list.length} exercício(s) encontrado(s)`;$('grid').innerHTML=list.map(x=>`<article class="card"><span class="tag">${esc(x.group)} • ${esc(x.equipment)}</span><h2>${esc(x.name)}</h2><p>${esc(x.summary)}</p><a class="btn" href="#exercicio/${encodeURIComponent(x.id)}">Ver execução →</a></article>`).join('')||'<p>Nenhum exercício encontrado.</p>'}
function route(){const slug=location.hash.startsWith('#exercicio/')?decodeURIComponent(location.hash.slice(11)):null;const x=data.find(e=>e.id===slug);$('catalog').classList.toggle('hidden',!!x);$('detail').classList.toggle('hidden',!x);if(x){const gif=x.gif?`<img src="${esc(x.gif)}" alt="Demonstração de ${esc(x.name)}" onerror="this.parentNode.textContent='GIF indisponível: confira o arquivo no catálogo.'">`:'GIF ainda não cadastrado';$('detail').innerHTML=`<a class="back" href="#">← Voltar ao catálogo</a><div class="eyebrow">${esc(x.group)} • ${esc(x.equipment)}</div><h1>${esc(x.name)}</h1><div class="visual">${gif}</div><h2>Como executar</h2><ol class="steps">${x.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><div class="note"><strong>Atenção:</strong> ${esc(x.caution)}</div><p><button class="btn" id="copy">Copiar link deste exercício</button></p>`;$('copy').onclick=()=>navigator.clipboard?navigator.clipboard.writeText(location.href).then(()=>{$('copy').textContent='Link copiado!'}):prompt('Copie o link:',location.href)}window.scrollTo(0,0)}
$('search').addEventListener('input',catalog);$('group').addEventListener('change',catalog);window.addEventListener('hashchange',route);catalog();route();
</script></body></html>
